const defaults=Object.entries(groups).flatMap(([category,names])=>names.split('|').map(name=>({name,category})));let foods=defaults;try{const saved=JSON.parse(localStorage.getItem('suitaba-menu-v1'));if(Array.isArray(saved)&&saved.every(f=>f&&typeof f.name==='string'&&typeof f.category==='string'))foods=saved}catch{}let mode='coin',busy=false,lastFood='',history=[];const removedUi={label:{textContent:''},hint:{textContent:''},history:{replaceChildren(){}}};const $=id=>document.getElementById(id)||removedUi[id];function updateCategories(){const old=$('category').value;$('category').replaceChildren(...['全部都可以',...new Set(foods.map(f=>f.category))].map(name=>{const option=document.createElement('option');option.textContent=name;return option}));if([...$('category').options].some(o=>o.value===old))$('category').value=old}updateCategories();

const addForm=document.createElement('form');addForm.className='menu-add';const addInput=document.createElement('input');addInput.placeholder='添加具体食物，比如葱油拌面';addInput.setAttribute('aria-label','新食物名称');addInput.maxLength=40;const addButton=document.createElement('button');addButton.textContent='添加';addButton.type='submit';addForm.append(addInput,addButton);$('dialog').insertBefore(addForm,$('search'));const note=document.createElement('p');note.className='menu-note';note.textContent='菜单保存在当前浏览器。删除立即生效，重新打开也不会恢复；清除浏览器数据会清除保存的修改。';addForm.before(note);const status=document.createElement('div');status.className='menu-note';status.setAttribute('role','status');addForm.after(status);
function saveMenu(next){try{localStorage.setItem('suitaba-menu-v1',JSON.stringify(next));foods=next;lastFood='';updateCategories();return true}catch{status.textContent='浏览器无法保存菜单，请允许本地存储后重试。';return false}}
renderMenu=function(){const matches=foods.filter(f=>f.name.includes($('search').value.trim()));$('count').textContent='共 '+foods.length+' 道食物 · 当前显示 '+matches.length+' 道';$('list').replaceChildren(...matches.map(f=>{const row=document.createElement('div');row.className='row';const name=document.createElement('span'),cat=document.createElement('small'),del=document.createElement('button');name.textContent=f.name;cat.textContent=f.category;del.className='delete-food';del.textContent='删除';del.setAttribute('aria-label','永久删除'+f.name);del.onclick=()=>{if(saveMenu(foods.filter(item=>item!==f))){status.textContent='已永久删除「'+f.name+'」。';renderMenu()}};row.append(name,cat,del);return row}));if(!matches.length)$('list').textContent=foods.length?'没有找到，换个关键词试试。':'菜单为空，添加一道喜欢的食物吧。'};
addForm.onsubmit=e=>{e.preventDefault();const name=addInput.value.trim();if(!name){status.textContent='请先填写食物名称。';return}if(foods.some(f=>f.name===name)){status.textContent='菜单里已经有这道食物。';return}if(saveMenu([...foods,{name,category:'我的菜单'}])){addInput.value='';$('search').value='';status.textContent='已添加「'+name+'」。';renderMenu()}};$('search').oninput=renderMenu;$('menu').onclick=()=>{status.textContent='';renderMenu();$('dialog').showModal()};
const oldGo=$('go').onclick;$('go').onclick=()=>{if(busy)return;if(mode==='food'&&!foods.some(f=>$('category').value==='全部都可以'||f.category===$('category').value)){$('result').textContent='先添加一道食物吧';return}oldGo();if(mode==='food')$('result').textContent='想一想'};
</script></body></html>
